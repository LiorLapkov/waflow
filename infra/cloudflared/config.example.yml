# Пример конфига Cloudflare Tunnel. Скопируй в config.yml и подставь значения.
# credentials-file (*.json) и cert.pem — секреты, в репозиторий НЕ коммитим.

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  # Панель оператора (frontend)
  - hostname: crm.example.com
    service: http://localhost:3002
  # API бэкенда (опционально, если фронт ходит на отдельный поддомен)
  - hostname: api.crm.example.com
    service: http://localhost:3001
  # Обязательный замыкающий блок
  - service: http_status:404
