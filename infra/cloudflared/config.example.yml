# Cloudflare Tunnel config template. Copy to config.yml and fill in values.
# credentials-file (*.json) and cert.pem are secrets — never committed.

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  # Single hostname — Caddy on :8080 routes both UI and API.
  - hostname: inbox.example.com
    service: http://localhost:8080
  # Required catch-all
  - service: http_status:404
