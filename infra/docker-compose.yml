# waflow — infrastructure.
# Run from the repo root:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d
#
# WhatsApp provider: Evolution API (Baileys). Multiple numbers, no licence.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot init: create the media bucket on first start.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET};
      echo 'bucket ready';
      "
    restart: 'no'

  # Redis used by Evolution for the event queue.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Dedicated Postgres for Evolution so the app DB and provider state
  # are independent — you can drop either without touching the other.
  evolution_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution -d evolution']
      interval: 5s
      timeout: 5s
      retries: 10

  # Evolution API (Baileys). Multi-instance, no licence.
  # Global webhook → backend; auth via the `apikey` field in the payload.
  #
  # IMPORTANT: Baileys only runs reliably on Linux x86_64.
  # On Apple Silicon (M-series) WhatsApp's anti-bot detects the TLS fingerprint of
  # Rosetta/VM layers and silently ignores the connection (stuck on "connecting").
  # Deploy on: a home Ubuntu/Debian box, a VPS (Hetzner, Vultr, …), etc.
  evolution:
    image: atendai/evolution-api:latest
    restart: unless-stopped
    depends_on:
      evolution_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_BASE_URL:-http://evolution:8080}

      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'true'

      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution_postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'true'
      DATABASE_SAVE_DATA_CHATS: 'true'

      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: 'true'
      CACHE_LOCAL_ENABLED: 'false'

      # Global webhook: every event from every instance is delivered here.
      # No per-instance webhooks are configured — the global one covers everything.
      WEBHOOK_GLOBAL_URL: ${BACKEND_PUBLIC_URL:-http://backend:3001}/webhooks/waha
      WEBHOOK_GLOBAL_ENABLED: 'true'
      # false → all events to a single URL (simpler for us).
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: 'false'
      WEBHOOK_EVENTS_QRCODE_UPDATED: 'true'
      WEBHOOK_EVENTS_CONNECTION_UPDATE: 'true'
      WEBHOOK_EVENTS_MESSAGES_UPSERT: 'true'
      WEBHOOK_EVENTS_MESSAGES_UPDATE: 'false'
      WEBHOOK_EVENTS_SEND_MESSAGE: 'false'
      WEBHOOK_EVENTS_CONTACTS_UPSERT: 'false'
      WEBHOOK_EVENTS_CHATS_UPSERT: 'false'

      # Embed media as base64 directly into webhooks — saves an extra fetch.
      CONFIG_SESSION_PHONE_CLIENT: waflow
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: '30'
      QRCODE_COLOR: '#198754'

      LANGUAGE: en
      LOG_LEVEL: ERROR,WARN,INFO,LOG,VERBOSE,DEBUG,WEBHOOKS
      LOG_COLOR: 'false'
      LOG_BAILEYS: warn
      DEL_INSTANCE: 'false'
    ports:
      - '${EVOLUTION_PORT:-8081}:8080'
    volumes:
      - evolution_instances:/evolution/instances

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      evolution:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: ${BACKEND_PORT:-3001}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://backend:3001}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3002}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      EVOLUTION_BASE_URL: ${EVOLUTION_INTERNAL_URL:-http://evolution:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-whatsapp-media}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    ports:
      - '${BACKEND_PORT:-3001}:3001'

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${FRONTEND_PORT:-3002}
    ports:
      - '${FRONTEND_PORT:-3002}:3002'

  # Reverse-proxy: a single external port that routes to backend/frontend.
  # Used both for local access (http://localhost:8080) and for Cloudflare Tunnel.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - '8080:8080'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  miniodata:
  redisdata:
  evolution_pgdata:
  evolution_instances:
  caddydata:
  caddyconfig:
