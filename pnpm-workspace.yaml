packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks postinstall scripts of dependencies by default.
# Allow the ones we actually need: argon2 native build and Prisma engines.
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  prisma: true

onlyBuiltDependencies:
  - argon2
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
